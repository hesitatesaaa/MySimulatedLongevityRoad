name: skill-quality

on:
  push:
  pull_request:

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install tiktoken pytest
      - name: Compile validation scripts
        run: python -m py_compile validation/skill_package_audit.py validation/test_skill_package.py
      - name: Audit package structure, encoding, and token budgets
        run: python validation/skill_package_audit.py --skill-dir deliverables/token-efficient-workflow --max-skill-tokens 800 --max-runtime-tokens 1200 --json
      - name: Run skill smoke tests
        run: python -m pytest -q validation/test_skill_package.py

