name: verify

on:
  push:
    branches: ['0.6.0', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    name: Offline checks (no game install)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      # build-release needs a local WorldBox + NeoModLoader install, so only the
      # offline half runs here. Tests that reference game assemblies
      # (animation-tests, ui-lineage-check) stay local.
      - name: Verify
        run: pwsh -NoProfile -File tools/verify-all.ps1 -SkipBuild -TestProjects actor-loading-tests,death-visual-tests
